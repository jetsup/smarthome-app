# Keep the machine responsive during Flutter/Gradle builds.
# Enable parallel execution across modules
org.gradle.parallel=true

# Strictly cap the total number of concurrent workers to 2
org.gradle.workers.max=2

# Keep the generous memory allocation to prevent CPU-heavy GC cycles
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
